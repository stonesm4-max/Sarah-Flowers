<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Materialize Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

<style>
body {
  background: #fff0f5;
}

#cartBtn {
  position: fixed;
  top: 15px;
  right: 15px;
  background:#ec407a;
  color:white;
  border:none;
  padding:10px 14px;
  border-radius:20px;
  z-index:1000;
}

.flower-gallery img {
  width: 30%;
  margin: 10px;
  cursor: pointer;
  border-radius: 10px;
}

.flower-gallery img.active {
  outline: 4px solid hotpink;
}
</style>
</head>

<body>

<!-- NAV -->
<nav class="pink darken-2">
  <div class="nav-wrapper container">
    <a href="#" class="brand-logo">Bloom Flowers</a>
    <ul class="right">
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="materialize.html">Materialize</a></li>
      <li><a href="jquery.html">jQuery</a></li>
      <li><a href="bootstrap.html">Bootstrap</a></li>
    </ul>
  </div>
</nav>

<!-- CART BUTTON -->
<button id="cartBtn">
  🛒 Cart: <span id="cartCount">0</span>
</button>

<div class="container center-align">

  <h3 class="pink-text text-darken-2">Welcome to Our Flower Gallery</h3>

  <p>
    Explore our beautiful floral arrangements designed with love and creativity.
  </p>

  <div class="section">
    <img src="Images/Images/2.jpg" alt="Flowers" class="circle responsive-img" width="250">
  </div>

  <div class="row">
    <div class="col s4">
      <img src="Images/Images/1.jpg" class="responsive-img">
    </div>
    <div class="col s4">
      <img src="Images/Images/2.jpg" class="responsive-img">
    </div>
    <div class="col s4">
      <img src="Images/Images/3.jpg" class="responsive-img">
    </div>
  </div>

</div>

<!-- TOGGLE SECTION -->
<div class="container">
  <button id="toggleBtn" class="btn pink">Shop Now</button>
  <p id="text">Select the kind of flowers you are shopping for!</p>
</div>

<!-- SHOP -->
<div class="container shop-section">
  <h4>Shop Now</h4>

  <div class="flower-gallery">
    <img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d" alt="Bouquet">
    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946" alt="Bouquet">
    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" alt="Bouquet">
  </div>
</div>

<!-- VIDEO -->
<div class="container section">
  <h5 class="center">Watch Our Flower Process</h5>

  <div class="video-container">
    <video width="640" height="480" controls>
      <source src="Images/Images/Flowervideo.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

<script>
$(function(){

  console.log("jQuery is connected!");

  // -----------------------
  // CART SYSTEM
  // -----------------------
  let cartCount = parseInt(localStorage.getItem("cartCount")) || 0;
  $("#cartCount").text(cartCount);

  // -----------------------
  // TOGGLE TEXT
  // -----------------------
  $("#toggleBtn").click(function(){
    $("#text").fadeToggle(400);

    if ($("#text").is(":visible")) {
      $(this).text("Hide Text");
    } else {
      $(this).text("Shop Now");
    }
  });

  // -----------------------
  // IMAGE CLICK (ADD TO CART FEEL)
  // -----------------------
  $(".flower-gallery img").click(function(){

    $(this).toggleClass("active").fadeOut(200).fadeIn(200);

    cartCount++;
    localStorage.setItem("cartCount", cartCount);
    $("#cartCount").text(cartCount);

    $("#text").text("Added to cart 🌸");

  });

});
</script>

</body>
</html>
