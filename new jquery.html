<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>jQuery Flower Shop</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Materialize CSS -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">

<!-- jQuery -->
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<style>
body {
  font-family: Arial, sans-serif;
  background: #ffe4ec;
  margin: 0;
  text-align: center;
}

/* FIXED NAVBAR */
nav {
  padding: 0 20px;
}

nav .nav-wrapper {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

nav .brand-logo {
  position: static;
  font-size: 1.6rem;
  white-space: nowrap;
}

nav ul {
  display: flex;
  align-items: center;
  gap: 15px;
  margin: 0;
}

/* PAGE CONTENT */
.main-content {
  padding: 20px;
}

button {
  background: #ec407a;
  color: white;
  border: none;
  padding: 12px 20px;
  border-radius: 8px;
  cursor: pointer;
  margin: 5px;
}

#text {
  margin-top: 15px;
  font-size: 18px;
}

#cart {
  font-weight: bold;
  margin-top: 10px;
}

.flower-gallery {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.flower-item {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.flower-gallery img {
  width: 150px;
  height: 170px;
  object-fit: cover;
  border-radius: 12px;
  cursor: pointer;
  transition: 0.3s;
}

.flower-gallery img:hover {
  transform: scale(1.05);
}

.addCartBtn {
  margin-top: 8px;
  padding: 6px 10px;
  font-size: 12px;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="pink lighten-2">
  <div class="nav-wrapper container">
    <a href="#" class="brand-logo">Bloom Flowers 🌸</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="shop.html">Shop</a></li>
      <li><a href="materialize.html">Materialize</a></li>
      <li><a href="jquery.html">jQuery</a></li>
    </ul>
  </div>
</nav>

<div class="main-content">

<h4>🌸 Flower Shop</h4>

<p id="text">Welcome to our shop!</p>
<p id="cart">Cart: 0 items</p>

<button id="hoursBtn">View Hours</button>
<button id="shuffleBtn">Shuffle Flowers</button>

<div class="flower-gallery">

  <div class="flower-item">
    <img src="https://images.unsplash.com/photo-1525310072745-f49212b5ac6d">
    <button class="addCartBtn" data-name="Pink Bouquet">Add to Cart</button>
  </div>

  <div class="flower-item">
    <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946">
    <button class="addCartBtn" data-name="Sunflower Mix">Add to Cart</button>
  </div>

  <div class="flower-item">
    <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93">
    <button class="addCartBtn" data-name="Rose Bundle">Add to Cart</button>
  </div>

</div>

</div>

<script>
$(document).ready(function () {

  let cartCount = Number(localStorage.getItem("cartCount")) || 0;
  const $cart = $("#cart");
  const $text = $("#text");

  function updateCart() {
    $cart.text(`Cart: ${cartCount} item(s)`);
  }

  updateCart();

  $(".addCartBtn").on("click", function () {
    const itemName = $(this).data("name");

    cartCount++;
    localStorage.setItem("cartCount", cartCount);

    updateCart();
    $text.text(`${itemName} added to cart 🌸`);
  });

  const hoursHTML = `
    <strong>Our Hours:</strong><br>
    Mon–Fri: 9 AM – 6 PM<br>
    Sat: 10 AM – 5 PM<br>
    Sun: Closed
  `;

  let showingHours = false;

  $("#hoursBtn").on("click", function () {
    showingHours = !showingHours;

    $text.html(showingHours ? hoursHTML : "Welcome to our shop!");
    $(this).text(showingHours ? "Hide Hours" : "View Hours");
  });

  const images = [
    "https://images.unsplash.com/photo-1525310072745-f49212b5ac6d",
    "https://images.unsplash.com/photo-1490750967868-88aa4486c946",
    "https://images.unsplash.com/photo-1509042239860-f550ce710b93",
    "https://images.unsplash.com/photo-1468327768560-75b778cbb551",
    "https://images.unsplash.com/photo-1501004318641-b39e6451bec6"
  ];

  let index = 0;

  $("#shuffleBtn").on("click", function () {
    index = (index + 1) % images.length;

    $(".flower-gallery img").each(function (i) {
      const newSrc = images[(index + i) % images.length];

      $(this).fadeOut(300, function () {
        $(this).attr("src", newSrc).fadeIn(300);
      });
    });
  });

});
</script>

<!-- Materialize JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>

</body>
</html>
